<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Live Chat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Lateef:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

body{
    background-color:#030303;
    margin:0;
    color:white;
    font-family:"Lateef", serif;
    overflow-x:hidden;
}

/* الهيدر */

#header{
    width:100%;
    height:170px;
    background:white;
    color:black;
    position:fixed;
    top:0;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:70px;
    z-index:999;
    box-shadow:0 0 20px rgba(255,255,255,0.2);
}

/* اسم المستخدم */

#userName{
    margin-right:20px;
}

/* الشات */

#chatBox{
    margin-top:190px;
    padding:20px;
    padding-bottom:300px;
    display:flex;
    flex-direction:column;
}

.msgGroup{
    display:flex;
    flex-direction:column;
    margin-bottom:25px;
}

.msgGroup.me{
    align-items:flex-end;
}

.msgGroup.other{
    align-items:flex-start;
}

.msg{
    max-width:75%;
    padding:25px;
    margin-top:8px;
    border-radius:35px;
    font-size:55px;
    position:relative;
    word-wrap:break-word;
    animation:show 0.3s ease;
    user-select:none;
}

/* رسالتي */

.myMsg{
    background:white;
    color:black;
    text-align:right;
    border-bottom-right-radius:5px;
}

/* رسائل الناس */

.otherMsg{
    background:#1e1e1e;
    color:white;
    text-align:left;
    border-bottom-left-radius:5px;
}

/* ⭐ إضافة رسالة الاشراف */

.adminMsg{
    background: rgba(0,191,255,0.25);
    color:white;
    border:3px solid white;
}

/* الاسم */

.name{
    display:block;
    font-size:45px;
    margin-bottom:15px;
    color:#00bfff;
    font-weight:bold;
}

/* النص */

.mainText{
    line-height:1.4;
}

/* زر الحذف */

.delBtn{
    background:red;
    color:white;
    border:none;
    border-radius:20px;
    padding:5px 15px;
    font-size:35px;
    margin-top:20px;
    font-family:"Lateef", serif;
}

/* الرد الحقيقي */

.replyThread{
    margin-top:25px;
    margin-right:60px;
    padding-right:25px;
    border-right:6px solid #00bfff;
}

.replyBubble{
    margin-top:20px;
    background:rgba(255,255,255,0.08);
    padding:18px;
    border-radius:25px;
    font-size:40px;
}

/* ⭐ ردود الاشراف */

.replyBubble.adminReply{
    background:rgba(0,191,255,0.25);
    border:2px solid #00bfff;
}

.replyName{
    color:#00bfff;
    display:block;
    margin-bottom:10px;
    font-size:35px;
}

/* الكتابة */

#controls{
    width:100%;
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#111;
    padding:20px;
    display:flex;
    gap:20px;
    box-sizing:border-box;
}

#msgInput{
    flex:1;
    height:120px;
    border:none;
    border-radius:40px;
    font-size:55px;
    padding-right:30px;
    font-family:"Lateef", serif;
    outline:none;
}

.sendBtn{
    width:220px;
    border:none;
    border-radius:40px;
    background:white;
    color:black;
    font-size:55px;
    font-family:"Lateef", serif;
}

/* reply preview */

#replyPreview{
    position:fixed;
    bottom:170px;
    right:20px;
    left:20px;
    background:#1a1a1a;
    border-right:10px solid #00bfff;
    padding:15px 25px;
    border-radius:25px;
    display:none;
    z-index:999;
}

#replyPreviewName{
    color:#00bfff;
    font-size:40px;
}

#replyPreviewText{
    font-size:35px;
}

#cancelReply{
    position:absolute;
    right:20px;
    top:15px;
    font-size:40px;
    color:red;
    cursor:pointer;
}

@keyframes show{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}

</style>

</head>

<body>

<div id="header">
👤 &nbsp;&nbsp;
<span id="userName">User</span>
</div>

<div id="chatBox"></div>

<div id="replyPreview">
<div id="cancelReply" onclick="cancelReply()">✖</div>
<div id="replyPreviewName"></div>
<div id="replyPreviewText"></div>
</div>

<div id="controls">
<input id="msgInput" placeholder="      اكتب سؤالك... ">
<button class="sendBtn" onclick="sendMsg()">إرسال</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
onSnapshot,
query,
orderBy,
deleteDoc,
doc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "chat-82b87.firebaseapp.com",
projectId: "chat-82b87",
storageBucket: "chat-82b87.firebasestorage.app",
messagingSenderId: "934528193582",
appId: "1:934528193582:web:7bbfbbacf73a758bccfbbf"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const name = localStorage.getItem("userName") || "Unknown";
const userId = localStorage.getItem("userId");

document.getElementById("userName").textContent = name;

let replyData = null;

window.sendMsg = async function(){
const input = document.getElementById("msgInput");
if(input.value.trim() === "") return;

await addDoc(collection(db,"messages"),{
name:name,
userId:userId,
text:input.value,
time:Date.now(),
reply: replyData ? {
name: replyData.name,
text: replyData.text
} : null
});

input.value = "";
cancelReply();
};

window.deleteMsg = async function(id){
await deleteDoc(doc(db,"messages",id));
};

window.setReply = function(name,text){
replyData = {name,text};
document.getElementById("replyPreview").style.display = "block";
document.getElementById("replyPreviewName").innerText = "Reply to " + name;
document.getElementById("replyPreviewText").innerText = text;
};

window.cancelReply = function(){
replyData = null;
document.getElementById("replyPreview").style.display = "none";
};

const q = query(collection(db,"messages"),orderBy("time"));

onSnapshot(q,(snapshot)=>{

const box = document.getElementById("chatBox");
box.innerHTML = "";

const messages = [];

snapshot.forEach(docSnap=>{
messages.push({id:docSnap.id,...docSnap.data()});
});

messages.forEach(data=>{

if(data.reply) return;

const isMe = data.userId === userId;
const isAdmin = data.name === "الاشراف";

const wrapper = document.createElement("div");
wrapper.className = `msgGroup ${isMe?'me':'other'}`;

const msg = document.createElement("div");

msg.className = `msg ${isMe?'myMsg':'otherMsg'} ${isAdmin?'adminMsg':''}`;

const replies = messages.filter(m =>
m.reply &&
m.reply.text === data.text &&
m.reply.name === data.name
);

let repliesHTML = "";

replies.forEach(reply=>{
const adminReply = reply.name === "الاشراف";

repliesHTML += `
<div class="replyThread">
<div class="replyBubble ${adminReply?'adminReply':''}">
<span class="replyName" style="${adminReply?'color:white;':''}">
${reply.name}
</span>
${reply.text}
</div>
</div>
`;
});

msg.innerHTML = `
<span class="name">${data.name}</span>
<div class="mainText">${data.text}</div>
${repliesHTML}
${isMe?`<br><button class="delBtn" onclick="deleteMsg('${data.id}')">حذف</button>`:""}
`;

msg.addEventListener("contextmenu",(e)=>{
e.preventDefault();
setReply(data.name,data.text);
});

wrapper.appendChild(msg);
box.appendChild(wrapper);
});

window.scrollTo(0,document.body.scrollHeight);
});

</script>

</body>
</html>
